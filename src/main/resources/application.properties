spring.application.name=alameed-backend

# Database — القيم الافتراضية للتطوير المحلي، وبتتغير بمتغيرات البيئة
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alameed}
spring.datasource.username=${DB_USERNAME:alameed}
spring.datasource.password=${DB_PASSWORD:alameed_dev_password}

# الجداول هتتعمل بـ Flyway migrations (هنضيفه مع أول جدول)، مش بـ Hibernate تلقائي
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# للتطوير بس: يظهر تفاصيل الـ health (منها حالة الداتابيز)
management.endpoint.health.show-details=always